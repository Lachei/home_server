        const w_overlay = 1 << 19;
        virtual_overlay_map = VirtualMap().init(w_overlay, w_overlay, {x: c[0], y: c[1]}, 256, 256, 255, TextureTypes(gl_context).un8rgba, gl_context);

        const vs = `#version 300 es
        #define PI 3.1415926535897932384626433832795
        precision highp int;
        precision highp float;
        precision highp sampler2DArray;
        precision highp usampler2D;
        precision highp usampler2DArray;

        uniform int mesh_res;               // quads per tile side
        uniform vec2 grid_offset_pos;
        uniform mat4 view;
        uniform mat4 view_proj;
        uniform float depth_offset;         // distance the eye was moved back for the 2d transition
        ${Util.glsl_virtual_texture_uniforms("heightmap", virtual_height_map)}
        layout(std140) uniform MeshTiles {
            vec4 mesh_tiles[${max_mesh_tiles}];  // xy: tile origin relative to grid_offset_pos, z: tile width in uv, w: quadtree level
        };

        // out variables
        out vec2 loc_pos;
        out float height_m;
        out float n_dot_l;
        out float depth;

        ${Util.glsl_calc_level()}
        ${Util.glsl_virtual_heightmap_load()}
        ${Util.glsl_wgs_84_m_to_uv()}
        
        void main(void) {
            // each tile is one triangle strip, every quad row is a strip which is connected to the next row
            // via degenerate triangles. The grid has an additional vertex ring around the tile which forms the skirt
            vec4 tile = mesh_tiles[gl_InstanceID];
            int cols = mesh_res + 3;
            int row = gl_VertexID / (2 * cols + 2);
            int k = clamp(gl_VertexID % (2 * cols + 2) - 1, 0, 2 * cols - 1);
            ivec2 grid = ivec2(k >> 1, row + (k & 1)) - 1;
            ivec2 grid_c = clamp(grid, ivec2(0), ivec2(mesh_res));
            bool skirt = grid != grid_c;

            loc_pos = tile.xy + vec2(grid_c) / float(mesh_res) * tile.z;

            // sample the heightmap at the level where the texel spacing equals the vertex spacing
            float level = max(tile.w + log2(float(mesh_res)) - ${heightmap_tile_res_log2}., 0.);
            vec4 d_info = virtual_heightmap_load(grid_offset_pos, loc_pos, level);
            height_m = d_info.x;
            n_dot_l = (max(0., dot(vec3(0, .7, .7), d_info.yzw)) * .5 + .5) + .05;
            float height = wgs_84_m_to_uv(height_m) * 1.4; // * sqrt(2) due to 1 / cos(45deg)
            if (skirt)

            vec4 pos_cam_rel = vec4(loc_pos, height, 1.);

            gl_Position = view_proj * pos_cam_rel;

            // 2d transition, otherwise the eye offset (which changes with every zoom) would make the delayed readback useless
            depth = -(view * pos_cam_rel).z - depth_offset;
        }

        ${Util.glsl_virtual_texture_uniforms("heightmap", virtual_height_map)}
        ${Util.glsl_virtual_texture_uniforms("overlaymap", virtual_overlay_map)}

        ${Util.glsl_virtual_texture_load("streetmap")}
        ${Util.glsl_virtual_texture_load("overlaymap")}

            // uint t = texture(virtual_streetmap_index, vec2(gl_FragCoord.xy) / vec2(textureSize(virtual_streetmap_index, 0).xy) * 40.).x;
            // out_col = texture(virtual_heightmap, vec3(uv_glob, float(t - 1u)));
            // return;
            // if (t == 0u)
            //     out_col = vec4(1., 0, 0, 1);
            // else
            //     out_col = vec4(float(t % 10u) * .1);
            // return;

            // ivec2 pixel_pos = ivec2(gl_FragCoord.xy);
            // ivec2 xy = pixel_pos % 256;
            // ivec2 tile = pixel_pos / 256;
            // int lev = tile.x + tile.y * 16;
            // out_col = texelFetch(virtual_streetmap, ivec3(xy, lev), 0);
            // return;

            // uint t = texelFetch(virtual_heightmap_index, pixel_pos, 0).r;
            // if (min(pixel_pos, textureSize(virtual_heightmap_index, 0)) != pixel_pos) {
            //     out_col = vec4(1., 0, 0, 1.);
            //     return;
            // }
            // if (t != 0u)
            //     out_col = vec4(1.);
            // else
            //     out_col = vec4(0.);
            // return;

            // vec2 uv_glob = wgs_84_to_uv(loc_pos + pos_off);
            vec2 dx = dFdx(loc_pos);
            vec2 dy = dFdy(loc_pos);
            float max_del = min(dot(dx, dx), dot(dy, dy));
            vec4 surface_col = virtual_streetmap_load(grid_offset_pos, loc_pos, get_level(max_del * 8.)) * color_correction;
            if (surface_col == vec4(0))
                surface_col = vec4(.85);
            if (1 == parcell_map_enabled) {
                surface_col += virtual_overlaymap_load(grid_offset_pos, loc_pos, get_level(max_del * 8.));
            }
            vec4 d_info = virtual_heightmap_load(grid_offset_pos, loc_pos, 18.);
            float nl = (dot(vec3(0, .7, .7), d_info.yzw) * .5 + .5) + .05;

            // out_col.xyz = mix(out_col.xyz, vec3(1), mist);

        #define PI 3.1415926535897932384626433832795
        precision highp int;
        precision highp float;
        precision highp sampler2DArray;
        precision highp usampler2D;
        precision highp usampler2DArray;

    window.onload = init;

    const Pos = (lat, lon) => {
        return {
            lat: lat,
            lon: lon,
            to_string: function () { return '{' + String(this.lat) + ', ' + String(this.lon) + '}'; },
        }
    };

    const f64_to_f32 = (f) => {
        return new Float32Array([f])[0];
    }

    const get_detail_base_pos = (pos, divider) => {
        // as the tiles are always increasing by 100, and we want a transfer of triangles
        // in 1/10th of the difference, we round the pos to multiple of 100 in each direction
        const offset = divider * 5;
        return Pos(f64_to_f32(Math.floor(pos.lat / divider) * divider - offset), f64_to_f32(Math.floor(pos.lon / divider) * divider - offset));
    };

    // constructs the forward vector which also takes pitch into account (if looking down, the front vector should also go down
    const get_forward_dir = (dir, pitch) => { return Vec4(Math.sin(dir) * Math.cos(pitch), Math.cos(dir) * Math.cos(pitch), Math.sin(pitch), 0); };
    // constructs the front vector which is always paralell to the ground (no z direction)
    const get_front_dir = (dir, pitch) => { return Vec4(Math.sin(dir), Math.cos(dir), 0, 0); };
    // constructs the right vector which is independent of the viewing pitch
    const get_right_dir = (dir) => { return Vec4(Math.cos(-dir), Math.sin(-dir), 0, 0); }; // the - sign is added as the we interpret the direction to go clock-wise
    // height (scene z) of the plane whose size on screen is kept during the transition to 2d, taken from the terrain at the
    // screen center when the transition starts. A fixed plane keeps the 2d scale stable while panning over hills
    let projection_focus_z = null;
    /** @returns {float} scene z of the terrain at the screen center, the terrain below the camera when looking at the sky */
    const terrain_focus_z = () => {
        const v = get_forward_dir(camera_dir, camera_pitch);    // the camera looks along -v
        const ground_z = (x, y) => Util.m_to_wgs_84_uv(terrain_height_mean_at(x, y) ?? 0) * 1.4;
        for (let d = Util.m_to_wgs_84_uv(1); d < Util.m_to_wgs_84_uv(200000); d *= 1.05) {
            const x = camera_center.x() - v.x() * d, y = camera_center.y() - v.y() * d, z = camera_center.z() - v.z() * d;
            if (z <= ground_z(x, y))
                return z;
        }
        return ground_z(camera_center.x(), camera_center.y());
    };
    /** @returns {float} distance in uv from the camera to the focus plane along the view direction */
    const focus_distance = () => {
        if (projection_focus_z === null)
            projection_focus_z = terrain_focus_z();
        const down = Math.max(get_forward_dir(camera_dir, camera_pitch).z(), .05);   // the camera looks along -forward
        return Math.max((camera_center.z() - projection_focus_z) / down, Util.m_to_wgs_84_uv(10));
    };
    const get_projection_mat = (camera_center, canvas) => {
        const displayWidth = canvas.width;
        const displayHeight = canvas.height;
        const height_multiplier = Math.max(1, 500000 * camera_center.z());
        // transition from 3d to 2d as dolly zoom: the field of view shrinks while the eye moves back along the view direction
        // such that the terrain at the focus distance keeps its size on screen, at the end it is replaced by the equal orthographic projection
        const t = Math.min(Math.max(+document.getElementById("camera_interpolation").value, 0), 1);
        const orthographic = t >= 1;
        const fov_deg = camera_fov_deg();
        const tan_half = Math.tan(fov_deg / 2 * Math.PI / 180);
        if (t == 0)
            projection_focus_z = null;
        const focus = t > 0 ? focus_distance() : 0;
        const s = orthographic ? 1e-3 : 1 - t;                  // tan(current fov / 2) / tan(fov / 2)
        const eye_offset = focus / s - focus;                   // distance the eye moves back
        const eye_fov_deg = 2 * Math.atan(tan_half * s) * 180 / Math.PI;
        const near = 1e-10 * height_multiplier + .5 * eye_offset;
        const far = .001 * height_multiplier + eye_offset;
        const aspect = displayWidth / displayHeight;
        const projection = orthographic ? Orthographic(focus * tan_half, focus * tan_half * aspect, near, far)
                                        : PerspectiveFov(eye_fov_deg, aspect, near, far);
        // the camera looks along -get_forward_dir, so moving back is along +forward
        const forward = get_forward_dir(camera_dir, camera_pitch);
        const eye = {x: camera_center.x() + forward.x() * eye_offset, y: camera_center.y() + forward.y() * eye_offset, z: camera_center.z() + forward.z() * eye_offset,
                     fov_deg: eye_fov_deg, offset: eye_offset};
        const base_width = Util.m_to_wgs_84_uv(100 * Math.max(1, .0005 * (Util.wgs_84_uv_to_m(camera_center.z()) - 1700))); // base width of a detail tile given in meters
        // grid jump for triangles is done all x meters
        let grid_offset_pos = get_detail_base_pos(Pos(camera_center.x(), camera_center.y()), base_width * 0.125);
        let at = forward.to_absolute_vec();
        at.entries[0] += eye.x - grid_offset_pos.lat;
        at.entries[1] += eye.y - grid_offset_pos.lon;
        at.entries[2] += eye.z;
        const view = LookAt(Vec4(eye.x - grid_offset_pos.lat, eye.y - grid_offset_pos.lon, eye.z, 1), // the tiles are moved relative to the camera center
            at,
            up_dir);
        let view_projection = projection;
        view_projection.mul(view);  // inplace multiplication which corresponds to Proj * View which means the view matrix is applied before the projection
        return [view_projection, view, base_width, grid_offset_pos, near, far, eye];
    }
    // Point in clip space to point in 3d space
    const clip_space_to_world = (clip_x, clip_y, linear_z, camera_center, canvas) => {
        const [view_projection, view, base_width, grid_offset_pos, near, far, eye] = get_projection_mat(camera_center, canvas3d);
        linear_z += eye.offset;     // the depth is stored relative to the camera before the eye was moved back
        const inv_view_proj = view_projection.inverse();
        let start_pos = inv_view_proj.multiply(Vec4(clip_x, clip_y, -1));
        let end_pos = inv_view_proj.multiply(Vec4(clip_x, clip_y, 1));
        for (let i = 0; i < 4; ++i) start_pos.entries[i] /= start_pos.entries[3];
        for (let i = 0; i < 4; ++i) end_pos.entries[i] /= end_pos.entries[3];
        // linear_z is the view space depth as written by the shader (not the distance along the ray), it changes linearly
        // along the ray for every projection, so the point is found by interpolating between the near and far plane points
        const depth = (p) => -view.multiply(p).z();
        const start_depth = depth(start_pos), end_depth = depth(end_pos);   // before end_pos is modified in place below
        start_pos.add(end_pos.sub(start_pos).mul((linear_z - start_depth) / (end_depth - start_depth)));
        start_pos.entries[0] += grid_offset_pos.lat;
        start_pos.entries[1] += grid_offset_pos.lon;
        return start_pos;
    };

    // ----------------------------------------------------------------------------------------
    // The following two functions are from https://mdn.github.io/webgl-examples/tutorial/sample5/index.html
    // ----------------------------------------------------------------------------------------

    // init shader program.
    function initShaderProgram(gl, vsSource, fsSource) {
        const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);
        // Create the shader program
        const shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, vertexShader);
        gl.attachShader(shaderProgram, fragmentShader);
        gl.linkProgram(shaderProgram);
        // If creating the shader program failed, alert
        if (!gl.getProgramParameter(shaderProgram, gl.LINK_STATUS)) {
            alert('Unable to initialize the shader program: ' + gl.getProgramInfoLog(shaderProgram));
            return null;
        }
        return shaderProgram;
    }

    //
    // creates a shader of the given type, uploads the source and
    // compiles it.
    //
    function loadShader(gl, type, source) {
        const shader = gl.createShader(type);
        // Send the source to the shader object
        gl.shaderSource(shader, source);
        // Compile the shader program
        gl.compileShader(shader);
        // See if it compiled successfully
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            alert('An error occurred compiling the shaders: ' + gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
        }
        return shader;
    }

    function resizeCanvasToDisplaySize(canvas, fb, gl) {
        // Lookup the size the browser is displaying the canvas in CSS pixels.
        const displayWidth = canvas.clientWidth;
        const displayHeight = canvas.clientHeight;
        // Check if the canvas is not the same size.
        const needResize = canvas.width !== displayWidth ||
            canvas.height !== displayHeight;
        if (needResize) {
            // Make the canvas the same size
            canvas.width = displayWidth;
            canvas.height = displayHeight;

            if (fb && gl) {
                fb.width = Math.floor(displayWidth * pre_draw_buffer_size_fact);
                fb.height = Math.floor(displayHeight * pre_draw_buffer_size_fact);

                if (fb.texture)
                    gl.deleteTexture(fb.texture);
                if (fb.depth_texture)
                    gl.deleteTexture(fb.depth_texture);
                if (fb.depth_test_texture)
                    gl.deleteTexture(fb.depth_test_texture);
                if (fb.fb)
                    gl.deleteFramebuffer(fb.fb);
                if (fb.depth_fb)
                    gl.deleteFramebuffer(fb.depth_fb);
                fb.texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, fb.texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, fb.width, fb.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                fb.depth_texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, fb.depth_texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, fb.width, fb.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                fb.depth_test_texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, fb.depth_test_texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT32F, fb.width, fb.height, 0, gl.DEPTH_COMPONENT, gl.FLOAT, null);
                fb.fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb.fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fb.texture, 0);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, fb.depth_texture, 0);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, fb.depth_test_texture, 0);
                fb.depth_fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb.depth_fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fb.depth_texture, 0);
                                   
                // updating the download buffers
                if (tile_download_buffer)
                    gl.deleteBuffer(tile_download_buffer);
                if (depth_download_buffer)
                    gl.deleteBuffer(depth_download_buffer);
                if (download_sync)
                    gl.deleteSync(download_sync);              
                const needed_bytes = fb.width * fb.height * 4;
                if (!tile_download_data || tile_download_data.byteLength != needed_bytes)
                    tile_download_data = new Uint8Array(needed_bytes);
                if (!depth_download_data || depth_download_data.byteLength != needed_bytes) {
                    depth_download_data = new Uint8Array(needed_bytes);
                    depth_data_f32 = new Float32Array(depth_download_data.buffer);
                }
                tile_download_buffer = gl.createBuffer();
                gl.bindBuffer(gl.PIXEL_PACK_BUFFER, tile_download_buffer);
                gl.bufferData(gl.PIXEL_PACK_BUFFER, needed_bytes, gl.STREAM_READ);
                depth_download_buffer = gl.createBuffer();
                gl.bindBuffer(gl.PIXEL_PACK_BUFFER, depth_download_buffer );
                gl.bufferData(gl.PIXEL_PACK_BUFFER, needed_bytes, gl.STREAM_READ);
            }
        }
        return needResize;
    };
    function request_full_screen() {
        var element = document.body;
        // Supports most browsers and their versions.
        var requestMethod = element.requestFullScreen || element.webkitRequestFullScreen || element.mozRequestFullScreen || element.msRequestFullScreen;

        if (requestMethod)
            requestMethod.call(element);
    };
    // also triggered when the header changes its height (e.g. wrapping on small screens)
    new ResizeObserver(() => {
        if (!gl_context)
            return;
        resizeCanvasToDisplaySize(canvas3d, indices_render_objs, gl_context);
        draw_requested = true;
    }).observe(canvas3d);
</script>
