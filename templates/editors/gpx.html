<!DOCTYPE html>

<html>

<head>
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Gpx Editor</title>
    <style>
        html * {
            font-family: Arial, Helvetica, sans-serif;
            font-size: min(2vw, .5cm);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0px;
            overflow: hidden;
        }

        /* the header takes the height it needs, the map gets the rest of the visible viewport (dvh excludes the mobile url bar) */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        a {
            cursor: pointer;
        }

        #save {
            border: none;
            background-color: white;
            cursor: pointer;
        }

        .preview {
            height: 100%;
            width: 100%;
            background-color: black;
        }

        .fill {
            width: 100%;
            height: 100%;
        }

        #header {
            flex: none;
            background-color: white;
        }

        #content {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        #preview {
            position: absolute;
            inset: 0;
        }

        #canvas3d {
            display: block;
        }

        .gpx_panel {
            position: absolute;
            left: 8px;
            bottom: 8px;
            max-width: calc(100% - 16px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, .92);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        .gpx_panel * {
            font-size: 15px;
        }

        .gpx_row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .gpx_panel button {
            min-height: 2.2em;
            padding: 0 .8em;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
        }

        .gpx_panel button.active {
            border-color: #e8471c;
            background-color: #e8471c;
            color: white;
        }

        .gpx_panel button:disabled {
            opacity: .4;
        }

        .gpx_panel input[type=number] {
            width: 4em;
        }

        #gpx_follow_progress {
            flex: 1;
            min-width: 120px;
        }

        .gpx_hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="header">
        {{#editor}}
        <center id="title">GPX Editor</center>
        <button id="save" type="button" onclick="save();">&#128190;</button>
        <select id="layer_select" onchange="virtual_street_map.drop_all_tiles();">
            <option base_url="tile.openstreetmap.org/" ending=".png" detail_switch_level="19">OSM</option>
            <option base_url="tile.opentopomap.org/" ending=".png" detail_switch_level="19">OpenTopo</option>
            <option base_url="maps.refuges.info/hiking/" ending=".png" detail_switch_level="19">OpenHiking</option>
            <option base_url="c.tile-cyclosm.openstreetmap.fr/cyclosm/" ending=".png" detail_switch_level="20">CyclOSM</option>
            <option base_url="server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/" swap_xy="true" ending="?blankTile=false" detail_switch_level="22">Satellit</option>
            <option base_url="intergeo33.bayernwolke.de/betty/atkis/" ending="" detail_switch_level="18">Straßen bayern</option>
            <option base_url="intergeo37.bayernwolke.de/betty/g_atkis3d/" ending="" detail_switch_level="18">Straßen bayern 3d</option>
            <option base_url="intergeo31.bayernwolke.de/betty/g_satdop40_komplett/" ending="" detail_switch_level="18" col_corr_b=".85">Satellit bayern</option>
            <option base_url="intergeo37.bayernwolke.de/betty/c_hist/" ending="" detail_switch_level="14">Historisch bayern</option>
            <option base_url="intergeo36.bayernwolke.de/betty/c_dgm_relief/" ending="" detail_switch_level="14">Gelände relief</option>
        </select>
        <input id="enable_tile_update" type="checkbox" checked onchange="draw_requested = true;">
        <label for="enable_tile_update">Karten tiles nachladen</label>
        <input id="triangle_resolution" type="number" min="10" max="1000" value="400">
        <label for="triangle_resolution">Geometrieauflösung</label>
        <input id="enable_cam_follow" type="checkbox">
        <label for="enable_cam_follow">Kamera folgen</label>
        <input id="enable_fpv_cam" type="checkbox">
        <label for="enable_fpv_cam">Erste person navigation</label>
        <input id="camera_interpolation" type="range" min="0" max="1" value="0" step=".01" oninput="draw_requested = true;">
        <label for="camera_interpolation">Projektion(3D.o.2D)</label>
        <input id="enable_parcell_map" onchange="camera_updated=true;" type="checkbox">
        <label for="enable_parcell_map">Parzellkarte anzeigen</label>
        <input id="enable_street_name_overlay" onchange="draw_requested = true;" type="checkbox">
        <label for="enable_street_name_overlay">Straßen anzeigen</label>
        <button type="button" onclick="request_full_screen();">Vollbild</button>
        {{/editor}}
    </div>
    <div id="content">
        <div id="preview" class="preview">
            <canvas id="canvas3d" class="fill"></canvas>
            <div id="gpx_panel" class="gpx_panel">
                <div class="gpx_row">
                    <button type="button" class="gpx_mode" data-mode="view">Ansehen</button>
                    <button type="button" class="gpx_mode gpx_editor_only" data-mode="edit">Bearbeiten</button>
                    <button type="button" class="gpx_mode gpx_editor_only" data-mode="record">Aufnehmen</button>
                    <button type="button" class="gpx_mode" data-mode="follow">Folgen</button>
                    <button type="button" class="gpx_mode" data-mode="measure">Messen</button>
                </div>
                <div id="gpx_measure_controls" class="gpx_row gpx_hidden">
                    <select id="gpx_measure_type">
                        <option value="distance">Strecke</option>
                        <option value="area">Fläche</option>
                        <option value="point">Punkt</option>
                    </select>
                    <button id="gpx_measure_undo" type="button">Letzten Punkt entfernen</button>
                    <button id="gpx_measure_clear" type="button">Zurücksetzen</button>
                </div>
                <div id="gpx_measure_result" class="gpx_hidden"></div>
                <div id="gpx_edit_controls" class="gpx_row gpx_hidden">
                    <label><input id="gpx_append_mode" type="checkbox">Punkte anhängen</label>
                    <button id="gpx_delete" type="button">Punkt löschen</button>
                    <button id="gpx_undo" type="button">Rückgängig</button>
                    <button id="gpx_new_segment" type="button">Neuer Track</button>
                </div>
                <div id="gpx_record_controls" class="gpx_row gpx_hidden">
                    <button id="gpx_record_toggle" type="button">Aufnahme starten</button>
                    <button id="gpx_average_start" type="button">Punkt mitteln</button>
                    <button id="gpx_average_accept" type="button">Übernehmen</button>
                    <button id="gpx_average_cancel" type="button">Abbrechen</button>
                    <label>Max. Ungenauigkeit <input id="gpx_max_accuracy" type="number" min="1" max="500" value="20"> m</label>
                    <label>Min. Abstand <input id="gpx_min_distance" type="number" min="0" max="1000" value="3"> m</label>
                </div>
                <div id="gpx_follow_controls" class="gpx_row gpx_hidden">
                    <button id="gpx_follow_play" type="button">&#9654;</button>
                    <select id="gpx_follow_speed">
                        <option value="5">5 km/h</option>
                        <option value="15">15 km/h</option>
                        <option value="50" selected>50 km/h</option>
                        <option value="150">150 km/h</option>
                        <option value="500">500 km/h</option>
                    </select>
                    <input id="gpx_follow_progress" type="range" min="0" max="1000" value="0">
                    <label>Abstand <input id="gpx_follow_zoom" type="range" min="-100" max="150" value="0"></label>
                    <label>Sichtfeld <input id="gpx_follow_fov" type="range" min="15" max="120" value="60"></label>
                </div>
                <div id="gpx_status"></div>
            </div>
        </div>
    </div>
</body>
<script type="text/javascript" src="/lin_alg.js"></script>
<script type="text/javascript" src="/virtual_texture.js"></script>
<script type="text/javascript" src="/gpx_track.js"></script>
<!--<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/spectorjs@0.9.30/dist/spector.bundle.js"></script>-->
<script>
    // var spector = new SPECTOR.Spector();
    // spector.displayUI();
    // spector.spyCanvases();

    const file_path = "{{&file_path}}";
    var file_revision = "{{&file_revision}}";

    let canvas3d = document.getElementById("canvas3d");
    let canvas_tile_ids_2d_ctx = null;
    let canvas_drag_start = null;
    let map_drag_start = null;      // same as canvas drag start but stores the surface position // in global format
    let camera_state = {};  // contains all camera state for rendering
    let gl_context = null;
    let tile_download_buffer = null;
    let tile_download_data = null;
    let depth_download_buffer = null;
    let depth_download_data = null;
    let depth_data_f32 = null;
    let download_sync = null;
    let indices_render_objs = {}; // object containing render objects needed for index rendering
    let render_pipelines = null;
    let camera_center = null;
    let camera_updated = false;
    const cam_rot_speed = .002;
    const cam_dir_speed = Util.m_to_wgs_84_uv(1); // go forward 1 meter
    const up_dir = Vec4(0, 0, 1, 0);
    const pre_draw_buffer_size_fact = 1 / 4;
    let camera_dir = 0;     // given in radians, 0 means dead north
    let camera_pitch = 0;   // given in radians, 0 means straight ahead, pi straight up -pi straight down
    let heightmap_meta_data = null;
    /** @type {VirtualHeightMap} */
    let virtual_height_map = null;
    let virtual_street_map = null;
    let virtual_overlay_map = null;
    let cur_gps_pos = null;
    const dist = (x1, y1, x2, y2) => {let x = x2 - x1, y = y2 - y1; return Math.sqrt(x * x + y * y);}
    const get_map_drag_start = (x, y) => {
        const clip_x = (x - canvas3d.getBoundingClientRect().x) / canvas3d.getBoundingClientRect().width * 2 - 1;
        const clip_y = (y - canvas3d.getBoundingClientRect().y) / canvas3d.getBoundingClientRect().height * -2 + 1;
        const depth_x = Math.min(Math.max(Math.floor((clip_x * .5 + .5) * indices_render_objs.width), 0), indices_render_objs.width - 1);
        const depth_y = Math.min(Math.max(Math.floor((clip_y * .5 + .5) * indices_render_objs.height), 0), indices_render_objs.height - 1);
        const linear_z = depth_data_f32[depth_y * indices_render_objs.width + depth_x];
        let p = clip_space_to_world(clip_x, clip_y, linear_z, camera_center, canvas3d);
        console.log(p.entries);
        return p;
    };
    canvas3d.addEventListener("mousedown", (e) => { 
        canvas_drag_start = { x: e.pageX, y: e.pageY, type: e.button == 0 ? "move" : e.button == 1 || e.button == 2 ? "rotate": "unknown"}; 
        // get the depth value and use it to calculate the world position
        map_drag_start = get_map_drag_start(e.pageX, e.pageY);
    });
    canvas3d.addEventListener("touchstart", (e) => {
                              let x = e.touches.length == 1 ? e.touches[0].pageX: .5 * e.touches[0].pageX + .5 * e.touches[1].pageX;
                              let y = e.touches.length == 1 ? e.touches[0].pageY: .5 * e.touches[0].pageY + .5 * e.touches[1].pageY;
                              canvas_drag_start = { x: x, y: y, 
                              dist: e.touches.length == 2? dist(e.touches[0].pageX, e.touches[0].pageY, e.touches[1].pageX, e.touches[1].pageY): 0, 
                              type: e.touches.length == 1 ? "move": "rot_or_zoom"};
                              map_drag_start = get_map_drag_start(x, y)});
    // user camera movements are rejected if they would end below the terrain, the camera then stays where it is
    const save_camera = () => { return {center: [...camera_center.entries], dir: camera_dir, pitch: camera_pitch}; };
    const restore_camera_if_below_terrain = (saved) => {
        if (!camera_below_terrain())
            return;
        camera_center.entries = saved.center;
        camera_dir = saved.dir;
        camera_pitch = saved.pitch;
    };
    const move_camera = (cur_move) => {
        if (!canvas_drag_start) 
            return;
        const saved_camera = save_camera();
        let xDel = canvas_drag_start.x - cur_move.x;
        let yDel = canvas_drag_start.y - cur_move.y;
        let height_multiplier = Math.max(1, .001 * (Util.wgs_84_uv_to_m(camera_center.z()) - 1100));
        if (map_drag_start && !isNaN(map_drag_start.entries[0]))
            height_multiplier = Math.max(1e-8,  40000 * camera_center.distance3(map_drag_start));
        let speed = cam_dir_speed * height_multiplier;
        let clear_move = true;
        switch(canvas_drag_start.type) {
        case "move":
            camera_center.add(get_front_dir(camera_dir, camera_pitch).mul(speed * yDel));
            camera_center.add(get_right_dir(camera_dir).mul(speed * xDel));
            break;
        case "rot_or_zoom":
            if (Math.abs(canvas_drag_start.dist - cur_move.dist) > 20)
                canvas_drag_start.type = "zoom";
            else if (Math.abs(xDel) + Math.abs(yDel) > 20)
                canvas_drag_start.type = "rotate";
            clear_move = false;
        case "zoom":
            let zoomDel = canvas_drag_start.dist - cur_move.dist;
            if (!map_drag_start || isNaN(map_drag_start.entries[0])) {
                camera_center.add(get_forward_dir(camera_dir, camera_pitch).mul(speed * zoomDel * 2));
            }
            else {
                camera_center.add(map_drag_start.subtract(camera_center).mul(cam_dir_speed * 100000 * -zoomDel));
            }
            xDel = 0;
            yDel = 0;
            break;
        case "rotate":
            const yaw = xDel * cam_rot_speed * 2;
            camera_dir -= yaw;
            if (camera_dir > 2 * Math.PI) camera_dir -= 2 * Math.PI;
            if (camera_dir < 0) camera_dir += 2 * Math.PI;
            const prev_pitch = camera_pitch;
            camera_pitch += yDel * cam_rot_speed * 2;
            if (camera_pitch > Math.PI / 2) camera_pitch = Math.PI / 2;
            if (camera_pitch < -Math.PI / 2) camera_pitch = -Math.PI / 2;
            const pitch = camera_pitch - prev_pitch; // only orbit by the pitch that was applied after clamping
            if (map_drag_start && !isNaN(map_drag_start.x()) && !document.getElementById('enable_fpv_cam').checked) {
                // following are the needed transformations:
                //  1. center projected map_drag_start pos
                //  2. rotate camera
                //  3. move back
                const forward = get_forward_dir(camera_dir, camera_pitch);
                const center = camera_center.addition(forward.mul(map_drag_start.subtract(camera_center).dot(forward)));
                const cur_angle = Math.atan2(camera_center.x() - center.x(), camera_center.y() - center.y());
                const m = Translate(map_drag_start.x(), map_drag_start.y(), map_drag_start.z())
                        .mul(RotateZ(yaw))
                        .mul(Translate(center.x() - map_drag_start.x(), center.y() - map_drag_start.y(), center.z() - map_drag_start.z()))
                        .mul(RotateZ(-cur_angle))
                        .mul(RotateX(pitch))
                        .mul(RotateZ(cur_angle))
                        .mul(Translate(-center.x(), -center.y(), -center.z()));
                camera_center = m.mul(camera_center);
            }
            break;
        default: console.error("Unknown move type " + canvas_drag_start.type);
        }
        // the drag movement is consumed even if rejected to avoid a jump when moving away from the terrain again
        restore_camera_if_below_terrain(saved_camera);
        if (clear_move) {
            canvas_drag_start = cur_move;
            camera_updated = true;
        }
    };
    canvas3d.addEventListener("mousemove", (e) => {
        if (!canvas_drag_start)
            return;
        let cur_move = {x: e.pageX, y: e.pageY, pageX: e.pageX, pageY: e.pageY, type: canvas_drag_start.type || "unknown"};
        move_camera(cur_move);
        e.preventDefault();
    });
    canvas3d.addEventListener("touchmove", (e) => {
        if (!canvas_drag_start)
            return;
        let x = e.touches.length == 1 ? e.touches[0].pageX: .5 * e.touches[0].pageX + .5 * e.touches[1].pageX;
        let y = e.touches.length == 1 ? e.touches[0].pageY: .5 * e.touches[0].pageY + .5 * e.touches[1].pageY;
        let cur_move = {x: x, y: y, pageX: e.pageX, pageY: e.pageY,
            dist: e.touches.length == 2? dist(e.touches[0].pageX, e.touches[0].pageY, e.touches[1].pageX, e.touches[1].pageY): 0, 
            type: canvas_drag_start.type || "unknown"};
        move_camera(cur_move);
        e.preventDefault();
    });
    canvas3d.addEventListener("mouseup", (e) => { canvas_drag_start = null; });
    canvas3d.addEventListener("mouseleave", (e) => { canvas_drag_start = null; });
    canvas3d.addEventListener("touchend", (e) => { canvas_drag_start = null; });
    canvas3d.addEventListener("touchcancel", (e) => { canvas_drag_start = null; });
    canvas3d.addEventListener("wheel", (e) => {
        map_drag_start = get_map_drag_start(e.pageX, e.pageY);
        const saved_camera = save_camera();
        if (!map_drag_start || isNaN(map_drag_start.entries[0])) {
            let height_multiplier = Math.max(1, .01 * (Util.wgs_84_uv_to_m(camera_center.z()) - 1100));
            camera_center.add(get_forward_dir(camera_dir, camera_pitch).mul(.1 * cam_dir_speed * height_multiplier * e.deltaY));
        }
        else {
            camera_center.add(map_drag_start.subtract(camera_center).mul(cam_dir_speed * 80000 * -e.deltaY));
        }
        restore_camera_if_below_terrain(saved_camera);
        camera_updated = true;
    });
    let pressed_keys = {};
    window.addEventListener("keydown", async (e) => {
        if (document.querySelector(".preview:hover") == null)
            return;

        let height_multiplier = Math.max(1, .001 * (Util.wgs_84_uv_to_m(camera_center.z()) - 1100));
        let speed = cam_dir_speed * height_multiplier;
        let key = e.key;
        if (key === key.toUpperCase()) {
            key = key.toLowerCase();
            speed *= 100;
        }
        const saved_camera = save_camera();
        if (key === "w")
            camera_center.add(get_forward_dir(camera_dir, camera_pitch).mul(-speed));
        if (key === "a")
            camera_center.add(get_right_dir(camera_dir).mul(-speed));
        if (key === "s")
            camera_center.add(get_forward_dir(camera_dir, camera_pitch).mul(speed));
        if (key === "d")
            camera_center.add(get_right_dir(camera_dir).mul(speed));
        if (key === "q")
            camera_center.add(up_dir.multiply(-speed));
        if (key === "e")
            camera_center.add(up_dir.multiply(speed));
        restore_camera_if_below_terrain(saved_camera);
        camera_updated = true;
    });

    function filter_object(obj, callback) {
        return Object.fromEntries(Object.entries(obj).filter(([key, val]) => callback(key, val)));
    };
    
    function get_selected_layer() {
        let s = document.getElementById("layer_select");
        return s.options[s.selectedIndex];
    };

    // mesh tiles -------------------------------------------------------------------------
    // The terrain is drawn as a quadtree of tiles aligned with the map tiles. Every tile is a grid of
    // mesh_res x mesh_res quads whose vertices are generated in the vertex shader from gl_VertexID,
    // the tile itself is selected by gl_InstanceID from the mesh_tiles uniform buffer
    const mesh_res = 64;                        // quads per tile side
    const mesh_res_log2 = Math.log2(mesh_res);
    const mesh_skirt_fac = .05;                 // skirt depth relative to the tile width, hides cracks between tiles of different levels
    const mesh_tiles_binding = 8;               // uniform buffer binding point, above the block indices used by the virtual textures
    const heightmap_tile_res_log2 = 8;          // heightmap tiles are 256 x 256
    // one strip per quad row (2 vertices per column incl. skirt columns) + 2 degenerate vertices to connect the rows
    const mesh_tile_vertex_count = (mesh_res + 2) * (2 * (mesh_res + 3) + 2);
    let max_mesh_tiles = 1024;                  // limited by the max uniform block size, set in init
    let mesh_tiles_buffer = null;
    let mesh_tiles_cpu = null;

    const default_fov_deg = 60;
    /** @returns {float} vertical field of view of the perspective camera in degrees, adjustable in the follow mode */
    const camera_fov_deg = () => gpx_mode == "follow" ? gpx_follow.fov_deg : default_fov_deg;
    // a tile is refined while its vertex spacing projects to more than canvas_height / triangle_resolution pixels
    const mesh_lod_factor = (triangle_resolution, fov_deg) => triangle_resolution / mesh_res / (2 * Math.tan(fov_deg / 2 * Math.PI / 180));
    /**
     * @brief selects the quadtree tiles to render such that a quad covers roughly
     * canvas_height / triangle_resolution pixels on screen
     * @returns {Object} data: Float32Array, count: int with per tile [x, y relative to grid_offset_pos, width, level], sorted front to back
     */
    const select_mesh_tiles = (view_projection, grid_offset_pos, triangle_resolution, eye) => {
        const e = view_projection.entries;
        // distances are measured from the effective eye of the projection (moved back for the transition to 2d)
        const cam_x = eye.x, cam_y = eye.y, cam_z = eye.z;
        const lod_factor = mesh_lod_factor(triangle_resolution, eye.fov_deg);
        // deeper levels would only add vertices between heightmap texels
        const max_level = virtual_height_map.max_level + heightmap_tile_res_log2 - mesh_res_log2;
        const z_pad = Util.m_to_wgs_84_uv(50); // margin for heights sampled from coarser levels
        const in_frustum = (x0, y0, w, z0, z1) => {
            // the box is outside if all 8 corners are outside of the same clip plane
            let all_out = 63;
            for (let c = 0; c < 8 && all_out; ++c) {
                const x = x0 + (c & 1) * w, y = y0 + ((c >> 1) & 1) * w, z = c & 4 ? z1 : z0;
                const cx = e[0] * x + e[4] * y + e[8]  * z + e[12];
                const cy = e[1] * x + e[5] * y + e[9]  * z + e[13];
                const cz = e[2] * x + e[6] * y + e[10] * z + e[14];
                const cw = e[3] * x + e[7] * y + e[11] * z + e[15];
                all_out &= (cx < -cw) | (cx > cw) << 1 | (cy < -cw) << 2 | (cy > cw) << 3 | (cz < -cw) << 4 | (cz > cw) << 5;
            }
            return all_out == 0;
        };

        let selected = [];
        let queue = [{level: 0, x: 0, y: 0, range: [-500, 9000], data_level: -1}];
        for (let qi = 0; qi < queue.length; ++qi) {
            let n = queue[qi];
            const w = 1 / (1 << n.level);
            const height_tile = virtual_height_map.get_uploaded_tile(n.level, n.x, n.y);
            if (height_tile && height_tile.height_range) {
                n.range = height_tile.height_range;
                n.data_level = n.level;
            }
            const x0 = n.x * w, y0 = n.y * w;
            const z0 = Util.m_to_wgs_84_uv(n.range[0]) * 1.4 - w * mesh_skirt_fac - z_pad;
            const z1 = Util.m_to_wgs_84_uv(n.range[1]) * 1.4 + z_pad;
            if (!in_frustum(x0 - grid_offset_pos.lat, y0 - grid_offset_pos.lon, w, z0, z1))
                continue;
            const dx = Math.max(x0 - cam_x, 0, cam_x - x0 - w);
            const dy = Math.max(y0 - cam_y, 0, cam_y - y0 - w);
            const dz = Math.max(z0 - cam_z, 0, cam_z - z1);
            n.dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            // children sample the heightmap at level + 1 + mesh_res_log2 - heightmap_tile_res_log2, only refine if that data is there
            const child_data_available = n.data_level >= n.level + 1 + mesh_res_log2 - heightmap_tile_res_log2;
            // refining replaces 1 tile by 4, the remaining queue entries are an upper bound for their final tile count
            const in_budget = selected.length + (queue.length - qi) + 3 <= max_mesh_tiles;
            if (n.level < max_level && w * lod_factor > n.dist && child_data_available && in_budget) {
                for (let c = 0; c < 4; ++c)
                    queue.push({level: n.level + 1, x: 2 * n.x + (c & 1), y: 2 * n.y + (c >> 1), range: n.range, data_level: n.data_level});
                continue;
            }
            selected.push(n);
        }

        selected.sort((a, b) => a.dist - b.dist); // front to back for early depth rejection
        selected.forEach((n, i) => {
            const w = 1 / (1 << n.level);
            mesh_tiles_cpu[i * 4]     = n.x * w - grid_offset_pos.lat;
            mesh_tiles_cpu[i * 4 + 1] = n.y * w - grid_offset_pos.lon;
            mesh_tiles_cpu[i * 4 + 2] = w;
            mesh_tiles_cpu[i * 4 + 3] = n.level;
        });
        return {data: mesh_tiles_cpu, count: selected.length};
    };

    // camera terrain collision ------------------------------------------------------------
    const height_grid_shift = 2;                // height grid cells are 4x4 heightmap texels
    const height_grid_res = 256 >> height_grid_shift;
    const min_cam_height_m = 2;                 // min distance between camera and terrain
    /**
     * @brief conservative terrain height at the given uv position from the deepest loaded heightmap tile
     * @returns {float} height in meters which is >= the rendered terrain height, null if no height data is loaded
     */
    const terrain_height_at = (x, y) => {
        for (let level = virtual_height_map.max_level; level >= 0; --level) {
            const n = 1 << level;
            const tile = virtual_height_map.get_uploaded_tile(level, Math.floor(x * n), Math.floor(y * n));
            if (!tile || !tile.height_grid)
                continue;
            // the shader interpolates between texel floor(p) and floor(p) + 1, take the max of all grid cells containing them
            const px = Math.min(Math.floor((x * n - Math.floor(x * n)) * 256), 255);
            const py = Math.min(Math.floor((y * n - Math.floor(y * n)) * 256), 255);
            let h = -Infinity;
            for (let gy = py >> height_grid_shift; gy <= Math.min(py + 1, 255) >> height_grid_shift; ++gy)
                for (let gx = px >> height_grid_shift; gx <= Math.min(px + 1, 255) >> height_grid_shift; ++gx)
                    h = Math.max(h, tile.height_grid[gy * height_grid_res + gx]);
            return h;
        }
        return null;
    };
    /** @returns {float} terrain height in meters at the given uv position (bilinear on the 4x4 texel means of the deepest loaded tile), null if not loaded */
    const terrain_height_mean_at = (x, y) => {
        for (let level = virtual_height_map.max_level; level >= 0; --level) {
            const n = 1 << level;
            const tile = virtual_height_map.get_uploaded_tile(level, Math.floor(x * n), Math.floor(y * n));
            if (!tile || !tile.height_grid_mean)
                continue;
            // texel i is at i / 256 in the tile, so the center of grid cell c is at c + .375 in grid units
            const gx = Math.min(Math.max((x * n - Math.floor(x * n)) * height_grid_res - .375, 0), height_grid_res - 1);
            const gy = Math.min(Math.max((y * n - Math.floor(y * n)) * height_grid_res - .375, 0), height_grid_res - 1);
            const x0 = Math.min(Math.floor(gx), height_grid_res - 2), y0 = Math.min(Math.floor(gy), height_grid_res - 2);
            const tx = gx - x0, ty = gy - y0;
            const at = (cx, cy) => tile.height_grid_mean[cy * height_grid_res + cx];
            return (at(x0, y0) * (1 - tx) + at(x0 + 1, y0) * tx) * (1 - ty) + (at(x0, y0 + 1) * (1 - tx) + at(x0 + 1, y0 + 1) * tx) * ty;
        }
        return null;
    };
    /** @returns {float} min camera z at the current camera position, null if no height data is loaded */
    const min_camera_z = () => {
        const h = terrain_height_at(camera_center.x(), camera_center.y());
        if (h === null)
            return null;
        return Util.m_to_wgs_84_uv(h + min_cam_height_m) * 1.4; // * 1.4 same as the height scaling in the vertex shader
    };
    const camera_below_terrain = () => {
        const min_z = min_camera_z();
        return min_z !== null && camera_center.z() < min_z;
    };
    /** 
     * @brief lifts the camera above the terrain, only needed if the terrain changed below the camera (finer data loaded, gps follow)
     * as user movements below the terrain are rejected
     * @returns {bool} true if the camera had to be moved up
     */
    const clamp_camera_above_terrain = () => {
        if (!camera_below_terrain())
            return false;
        camera_center.entries[2] = min_camera_z();
        return true;
    };

    let draw_requested = true;
    let drawing_active = false;
    // only one readback of the tile id and depth buffers is in flight at a time, otherwise the download buffers would be
    // written again by newer frames before the fenced data is read (causes pipeline stalls on getBufferSubData)
    let pending_readback = null;    // {fence, grid_offset_pos, tile_buffer, depth_buffer}
    let readback_skipped = false;   // a frame was drawn without readback, has to be redrawn after the pending readback is done
    async function draw_scene() {
        draw_requested |= camera_updated;
        if (document.getElementById("enable_cam_follow").checked && cur_gps_pos) {
            const interp_factor = .05;
            let pre_x = camera_center.x();
            let pre_y = camera_center.y();
            let f = get_forward_dir(camera_dir, camera_pitch);
            f.entries[2] = Math.max(.1, f.z());
            f.normalize();
            f.mul(camera_center.z() / f.z());
            camera_center.entries[0] = interp_factor * (cur_gps_pos.lat + f.x()) + (1 - interp_factor) * camera_center.x();
            camera_center.entries[1] = interp_factor * (cur_gps_pos.lon + f.y()) + (1 - interp_factor) * camera_center.y();
            draw_requested |= Math.abs(pre_x - camera_center.x()) > 1e-7 || Math.abs(pre_y - camera_center.y()) > 1e-8; 
        }
        if (gpx_mode == "follow" && (gpx_follow.playing || gpx_follow.update_requested))
            update_follow_camera();
        // checked every tick as finer height data might have been loaded below the camera
        draw_requested |= clamp_camera_above_terrain();

        if (!gl_context || drawing_active || !draw_requested)
            return;
        drawing_active = true;
        draw_requested = false;
        camera_updated = false;

        // creating the view matrix -------------------------------------------
        const [view_projection, view, base_width, grid_offset_pos, , , eye] = get_projection_mat(camera_center, canvas3d);

        // drawing the tiles --------------------------------------------------
        const draw_tiles = (gl, fb_size, program, framebuffer) => {
            gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
            gl.viewport(0, 0, fb_size.width, fb_size.height);
            gl.clearColor(1., 1., 1., 1.0);
            gl.clearDepth(1.0);

            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            gl.enable(gl.DEPTH_TEST);

            gl.useProgram(program.program);
            gl.uniformMatrix4fv(program.uniform_locations.view, false, view.entries);
            gl.uniformMatrix4fv(program.uniform_locations.view_proj, false, view_projection.entries);
            gl.uniform1f(program.uniform_locations.depth_offset, eye.offset);
            if (program.uniform_locations.color_correction) { 
                let selected_layer = get_selected_layer();
                let b = 1.;
                let attr = selected_layer.getAttribute("col_corr_b");
                if (attr)
                    b = parseFloat(attr);
                gl.uniform4f(program.uniform_locations.color_correction, 1, 1, b, 1);
            }
            
            // binding the virtual textures
            virtual_height_map.bind_to_shader(gl.TEXTURE0, gl.TEXTURE1, program.uniform_locations.virtual_heightmap_infos);
            gl.uniform1i(program.uniform_locations.virtual_heightmap_index, 0);
            gl.uniform1i(program.uniform_locations.virtual_heightmap, 1);
            gl.uniformBlockBinding(program.program, program.uniform_locations.virtual_heightmap_infos, program.uniform_locations.virtual_heightmap_infos);
            if (program.uniform_locations.virtual_streetmap_infos < 10) {
                virtual_street_map.bind_to_shader(gl.TEXTURE2, gl.TEXTURE3, program.uniform_locations.virtual_streetmap_infos);
                gl.uniform1i(program.uniform_locations.virtual_streetmap_index, 2);
                gl.uniform1i(program.uniform_locations.virtual_streetmap, 3);
                gl.uniformBlockBinding(program.program, program.uniform_locations.virtual_streetmap_infos, program.uniform_locations.virtual_streetmap_infos);
            }
            if (program.uniform_locations.virtual_overlaymap_infos < 20) {
                virtual_overlay_map.bind_to_shader(gl.TEXTURE4, gl.TEXTURE5, program.uniform_locations.virtual_overlaymap_infos);
                gl.uniform1i(program.uniform_locations.virtual_overlaymap_index, 4);
                gl.uniform1i(program.uniform_locations.virtual_overlaymap, 5);
                gl.uniformBlockBinding(program.program, program.uniform_locations.virtual_overlaymap_infos, program.uniform_locations.virtual_overlaymap_infos);
            }
            if (document.getElementById("enable_parcell_map").checked || document.getElementById("enable_street_name_overlay").checked) {
                gl.uniform1i(program.uniform_locations.parcell_map_enabled, 1);
            } else {
                gl.uniform1i(program.uniform_locations.parcell_map_enabled, 0);
            }
            // drawing all mesh tiles with a single instanced draw call
            gl.bindBufferBase(gl.UNIFORM_BUFFER, mesh_tiles_binding, mesh_tiles_buffer);
            gl.uniformBlockBinding(program.program, program.uniform_locations.mesh_tiles, mesh_tiles_binding);
            gl.uniform1i(program.uniform_locations.mesh_res, mesh_res);
            gl.uniform2f(program.uniform_locations.grid_offset_pos, grid_offset_pos.lat, grid_offset_pos.lon);
            if (!framebuffer)
                gl.drawBuffers([gl.BACK]);
            else
                gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
            gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, mesh_tile_vertex_count, mesh_tiles.count);
        }
        const update_tiles = document.getElementById("enable_tile_update").checked;
        let start = performance.now();
        // select and upload the mesh tiles once, they are shared by both passes
        const mesh_tiles = select_mesh_tiles(view_projection, grid_offset_pos, + document.getElementById("triangle_resolution").value, eye);
        gl_context.bindBuffer(gl_context.UNIFORM_BUFFER, mesh_tiles_buffer);
        gl_context.bufferSubData(gl_context.UNIFORM_BUFFER, 0, mesh_tiles.data, 0, mesh_tiles.count * 4);
        gl_context.bindBuffer(gl_context.UNIFORM_BUFFER, null);
        console.log(`Selected ${mesh_tiles.count} mesh tiles in ${performance.now() - start} milli`);
        const do_readback = !pending_readback;
        readback_skipped = !do_readback;
        // draw tile ids ---------------------------------------
        if (update_tiles && do_readback)
            draw_tiles(gl_context, { width: indices_render_objs.width, height: indices_render_objs.height }, render_pipelines.idx, indices_render_objs.fb);

        // draw normal frame -----------------------------------
        draw_tiles(gl_context, { width: canvas3d.width, height: canvas3d.height }, render_pipelines.terrain, null); // null sets teh default canvas framebuffer as target
        draw_track(view_projection, grid_offset_pos, eye);
        
        // copy to download gpu buffers
        if (do_readback) {
            // tile buffer
            gl_context.bindFramebuffer(gl_context.READ_FRAMEBUFFER, indices_render_objs.fb);
            gl_context.bindBuffer(gl_context.PIXEL_PACK_BUFFER, tile_download_buffer);
            gl_context.readPixels(0, 0, indices_render_objs.width, indices_render_objs.height, gl_context.RGBA, gl_context.UNSIGNED_BYTE, 0);
            // depth buffer
            gl_context.bindFramebuffer(gl_context.READ_FRAMEBUFFER, indices_render_objs.depth_fb);
            gl_context.bindBuffer(gl_context.PIXEL_PACK_BUFFER, depth_download_buffer);
            gl_context.readPixels(0, 0, indices_render_objs.width, indices_render_objs.height, gl_context.RGBA, gl_context.UNSIGNED_BYTE, 0);
            gl_context.bindBuffer(gl_context.PIXEL_PACK_BUFFER, null);
            // final sync
            pending_readback = {
                fence: gl_context.fenceSync(gl_context.SYNC_GPU_COMMANDS_COMPLETE, 0),
                grid_offset_pos: {x: grid_offset_pos.lat, y: grid_offset_pos.lon},  // needed to decode the tile ids
                tile_buffer: tile_download_buffer,
                depth_buffer: depth_download_buffer,
            };
            gl_context.flush(); // makes sure the fence is submitted and can be signaled
        }
        console.log(`drawing took ${performance.now() - start} milli`);
        drawing_active = false;
    }
    let tile_processing_running = false;
    async function gpu_tile_processing() {
        if (tile_processing_running || !pending_readback)
            return;
        tile_processing_running = true;

        let start = performance.now();
        let tile_processing_start = start;
        const readback = pending_readback;
        let fence_signaled = true;
        try {
            await clientWaitAsync(gl_context, readback.fence);
        } catch (e) {
            // a lost fence must not stop the readbacks forever, the next frame issues a new one
            console.log(`gpu_tile_processing: dropping readback, ${e.message}`);
            fence_signaled = false;
        }
        gl_context.deleteSync(readback.fence);
        pending_readback = null;
        if (readback_skipped || !fence_signaled)
            draw_requested = true;
        if (!fence_signaled) {
            tile_processing_running = false;
            return;
        }
        // the download buffers were recreated by a resize in the meantime, the readback is invalid
        if (readback.tile_buffer !== tile_download_buffer || readback.depth_buffer !== depth_download_buffer) {
            tile_processing_running = false;
            return;
        }
        gl_context.bindBuffer(gl_context.PIXEL_PACK_BUFFER, tile_download_buffer);
        gl_context.getBufferSubData(gl_context.PIXEL_PACK_BUFFER, 0, tile_download_data);

        gl_context.bindBuffer(gl_context.PIXEL_PACK_BUFFER, depth_download_buffer);
        gl_context.getBufferSubData(gl_context.PIXEL_PACK_BUFFER, 0, depth_download_data);
        gl_context.bindBuffer(gl_context.PIXEL_PACK_BUFFER, null);

        console.log(`only reading the pixels took ${performance.now() - start} milli`);

        start = performance.now();
        let indices = new Uint32Array(tile_download_data.buffer);
        let needed_tiles = new Set(indices);
        needed_tiles.delete(0xffffffff);
        console.log(`checking tiles took ${performance.now() - start} milli`);
        let decoded_tiles = Util.int32_to_tile_id(needed_tiles, readback.grid_offset_pos);
        Util.add_missing_parent_tiles(decoded_tiles);
        // max level for height is tile 15 
        const tile_on_minifuzi = (tile) => {return heightmap_meta_data && heightmap_meta_data.tiles_set && heightmap_meta_data.tiles_set.has(`${tile.level}/${tile.x}/${tile.y}`);}
        let requested_tiles = decoded_tiles.filter(tile => !isNaN(tile.x) && !isNaN(tile.y) && (tile_on_minifuzi(tile) || tile.level <= 15)).map(tile => TileRequest().init(tile.x, tile.y, tile.level,
            !tile_on_minifuzi(tile) ? `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${tile.level}/${tile.x}/${tile.y}.png`:
                                   `${location.origin}/heightmap/${tile.level}/${tile.x}/${tile.y}`
        ));
        virtual_height_map.update_needed_tiles(requested_tiles, {x: camera_center.x(), y: camera_center.y()});
        let layer = get_selected_layer();
        const offset_level = (level, layer) => {
            if (layer.getAttribute("level_offset"))
                level += +layer.getAttribute("level_offset");
            return level;
        };
        const offset_xy = (layer) => {
            let offset = {x: 0, y: 0};
            if (layer.getAttribute("x_offset")) 
                offset.x = parseFloat(layer.getAttribute("x_offset"));
            if (layer.getAttribute("y_offset")) 
                offset.y = parseFloat(layer.getAttribute("y_offset"));
            return offset;
        };
        let requested_streetmap_tiles = decoded_tiles.map(tile => 
            TileRequest().init(tile.x, tile.y, offset_level(tile.level, layer),
            !layer.getAttribute("swap_xy") ? `https://${layer.getAttribute("base_url")}${tile.level}/${tile.x}/${tile.y}${layer.getAttribute("ending") || ""}`
                                           : `https://${layer.getAttribute("base_url")}${tile.level}/${tile.y}/${tile.x}${layer.getAttribute("ending") || ""}`,
        )).filter(e => e.level <= layer.getAttribute("detail_switch_level"));
        virtual_street_map.update_needed_tiles(requested_streetmap_tiles, {x: camera_center.x(), y: camera_center.y()});
        if (document.getElementById("enable_parcell_map").checked || document.getElementById("enable_street_name_overlay").checked) {
            let requested_parcell_tiles = decoded_tiles.map(tile => {
                let urls = [];
                if (document.getElementById("enable_parcell_map").checked)
                    urls.push(`https://intergeo35.bayernwolke.de/betty/c_g_atkishybrid_alkisinvers_parzellar/${tile.level}/${tile.x}/${tile.y}`);
                if (document.getElementById("enable_street_name_overlay").checked)
                    urls.push(`https://intergeo33.bayernwolke.de/betty/g_atkishybrid_webp/${tile.level}/${tile.x}/${tile.y}`);
                return TileRequest().init(tile.x, tile.y, tile.level, urls);
            }).filter(e => e.level <= 19);
            virtual_overlay_map.update_needed_tiles(requested_parcell_tiles, {x: camera_center.x(), y: camera_center.y()});
        }
        console.log(decoded_tiles);
        
        console.log(`Full tile update took ${performance.now() - tile_processing_start} milli`);
        tile_processing_running = false;
    }
    let tex_update_locked = {};
    function check_virtual_textures_update(name, virtual_texture) {
        if (tex_update_locked[name])
            return;
        tex_update_locked[name] = true;
        let start = performance.now();
        virtual_texture.upload_loaded_images();
        if (virtual_texture.virtual_texture_rebuilt) {
            virtual_texture.virtual_texture_rebuilt = false;
            console.log(`updating virtual textures ${name} took ${performance.now() - start} milli`);
            console.log(`Free spots virtual texture ${name} per cascade: ${virtual_texture.cascades.map(c => c.free_tiles.size).join(', ')}`);
            draw_requested = true;;
        }
        tex_update_locked[name] = false;
    }
    function updateGpsPosition(p) {
        let [lat, lon] = Util.wgs_84_to_uv(p.coords.latitude, p.coords.longitude);
        cur_gps_pos = {lat: lat, lon: lon};
        console.log("Update cur_gps_pos:");
        console.log(p);
        console.log(cur_gps_pos);
    }
    // ----------------------------------------------------------------------------------------
    // gpx editing, recording and follow animation
    // ----------------------------------------------------------------------------------------
    const is_editor = "{{#editor}}1{{/editor}}" == "1";
    const is_touch = 'ontouchstart' in document.documentElement;
    const gpx_backup_key = "gpx_backup:" + file_path;
    const gpx_doc = GpxDocument().load("{{&file_data}}");
    const gpx_recorder = GpsRecorder();
    const gpx_follower = TrackFollower();
    /** @type {TrackRenderer} */
    let track_renderer = null;
    let gpx_mode = "view";              // one of view, edit, record, follow
    let gpx_selected = null;            // {seg: int, i: int} index of the selected point
    let gpx_active_segment = null;      // segment new points are appended to if no point is selected
    let gpx_drag = null;                // {undo_pushed: bool} while a point is dragged
    let gpx_record_track_name = null;   // name of the track the recording is appended to
    let gpx_saved_version = gpx_doc.version;
    let gpx_saving = false;
    let gpx_save_state = "";
    // zoom scales the distance of the camera to the current position
    const gpx_follow = {playing: false, update_requested: false, s: 0, speed_mps: 50 / 3.6, last_t: 0, dir: null, zoom: 1, fov_deg: 60};

    const gpx_changed = () => {
        draw_requested = true;
        update_gpx_ui();
    };
    /** @brief replaces the document content (remote change or merge), the indices of the selection are invalid afterwards */
    const gpx_reload = (text) => {
        gpx_doc.load(text);
        gpx_saved_version = gpx_doc.version;
        gpx_selected = null;
        gpx_active_segment = null;
        gpx_follower.init(gpx_doc);
        gpx_changed();
    };
    /** @returns {GpxSegment} the segment the recording appends to, found by the track name to survive reloads of the document */
    const gpx_record_segment = () => {
        if (!gpx_record_track_name)
            return null;
        return gpx_doc.segments.find(s => s.kind == "trk" && gpx_doc.child_element(s.element.parentElement, "name")?.textContent == gpx_record_track_name) || null;
    };

    // picking --------------------------------------------------------------------------------
    /** @returns {Object} x, y position in css pixels relative to the canvas, null if behind the camera */
    const project_to_screen = (view_projection, grid_offset_pos, x, y) => {
        const e = view_projection.entries;
        const px = x - grid_offset_pos.lat, py = y - grid_offset_pos.lon;
        const pz = Util.m_to_wgs_84_uv(terrain_height_mean_at(x, y) ?? 0) * 1.4;
        const cx = e[0] * px + e[4] * py + e[8] * pz + e[12];
        const cy = e[1] * px + e[5] * py + e[9] * pz + e[13];
        const cw = e[3] * px + e[7] * py + e[11] * pz + e[15];
        if (cw <= 0)
            return null;
        const r = canvas3d.getBoundingClientRect();
        return {x: (cx / cw * .5 + .5) * r.width, y: (.5 - cy / cw * .5) * r.height};
    };
    /** @returns {Object} seg, i of the point closest to the screen position within radius pixels */
    const gpx_pick_point = (sx, sy, radius) => {
        const [view_projection, , , grid_offset_pos] = get_projection_mat(camera_center, canvas3d);
        let best = null, best_d = radius;
        gpx_doc.segments.forEach((seg, si) => seg.points.forEach((p, i) => {
            const s = project_to_screen(view_projection, grid_offset_pos, p.x, p.y);
            const d = s ? Math.hypot(s.x - sx, s.y - sy) : Infinity;
            if (d < best_d) {
                best_d = d;
                best = {seg: si, i: i};
            }
        }));
        return best;
    };
    /** @returns {Object} seg, i, x, y of the closest line within radius pixels, i is the index a new point has to be inserted at */
    const gpx_pick_line = (sx, sy, radius) => {
        const [view_projection, , , grid_offset_pos] = get_projection_mat(camera_center, canvas3d);
        let best = null, best_d = radius;
        gpx_doc.segments.forEach((seg, si) => {
            if (seg.kind == "wpt")
                return;
            let prev = null;
            seg.points.forEach((p, i) => {
                const cur = project_to_screen(view_projection, grid_offset_pos, p.x, p.y);
                if (prev && cur) {
                    const dx = cur.x - prev.x, dy = cur.y - prev.y;
                    const t = Math.min(Math.max(((sx - prev.x) * dx + (sy - prev.y) * dy) / Math.max(dx * dx + dy * dy, 1e-9), 0), 1);
                    const d = Math.hypot(prev.x + t * dx - sx, prev.y + t * dy - sy);
                    if (d < best_d) {
                        best_d = d;
                        const a = seg.points[i - 1];
                        best = {seg: si, i: i, x: a.x + t * (p.x - a.x), y: a.y + t * (p.y - a.y)};
                    }
                }
                prev = cur;
            });
        });
        return best;
    };

    // editing --------------------------------------------------------------------------------
    /** @brief inserts a point after the selected one, otherwise at the end of the active segment (creates a track if there is none) */
    const gpx_append_point = (x, y) => {
        let seg_index, i;
        if (gpx_selected && gpx_doc.segments[gpx_selected.seg].kind != "wpt") {
            seg_index = gpx_selected.seg;
            i = gpx_selected.i + 1;
        } else {
            let seg = gpx_doc.segments.includes(gpx_active_segment) ? gpx_active_segment : gpx_doc.segments.findLast(s => s.kind == "trk");
            if (!seg)
                seg = gpx_doc.create_track("Track");
            seg_index = gpx_doc.segments.indexOf(seg);
            i = seg.points.length;
        }
        gpx_doc.insert_point(gpx_doc.segments[seg_index], i, {x: x, y: y, ele: terrain_height_mean_at(x, y)});
        return {seg: seg_index, i: i};
    };
    const gpx_delete_selected = () => {
        if (!gpx_selected)
            return;
        gpx_doc.push_undo();
        const seg = gpx_doc.segments[gpx_selected.seg];
        gpx_doc.delete_point(seg, gpx_selected.i);
        // the neighbour gets selected to allow deleting several points in a row
        gpx_selected = seg.points.length ? {seg: gpx_selected.seg, i: Math.min(gpx_selected.i, seg.points.length - 1)} : null;
        gpx_changed();
    };
    const gpx_undo = () => {
        if (gpx_recorder.recording || !gpx_doc.undo())
            return;
        gpx_selected = null;
        gpx_active_segment = null;
        gpx_changed();
    };
    /** @returns {bool} true if the event was used for editing and must not move the camera */
    const gpx_pointer_down = (touch, page_x, page_y) => {
        if (gpx_mode == "measure")
            return measure_pointer_down(touch, page_x, page_y);
        if (gpx_mode != "edit" || !is_editor || gpx_doc.parse_error)
            return false;
        const r = canvas3d.getBoundingClientRect();
        const sx = page_x - r.left, sy = page_y - r.top;
        const radius = touch ? 28 : 14;
        let hit = gpx_pick_point(sx, sy, radius);
        let undo_pushed = false;
        if (!hit) {
            const line_hit = gpx_pick_line(sx, sy, radius * .7);
            if (line_hit) {
                gpx_doc.push_undo();
                gpx_doc.insert_point(gpx_doc.segments[line_hit.seg], line_hit.i, {x: line_hit.x, y: line_hit.y, ele: terrain_height_mean_at(line_hit.x, line_hit.y)});
                hit = {seg: line_hit.seg, i: line_hit.i};
            } else if (document.getElementById("gpx_append_mode").checked) {
                const w = get_map_drag_start(page_x, page_y);
                if (!w || isNaN(w.x()))
                    return false;
                gpx_doc.push_undo();
                hit = gpx_append_point(w.x(), w.y());
            } else {
                if (gpx_selected) {
                    gpx_selected = null;
                    gpx_changed();
                }
                return false;
            }
            undo_pushed = true;
        }
        gpx_selected = hit;
        gpx_active_segment = gpx_doc.segments[hit.seg];
        gpx_drag = {undo_pushed: undo_pushed};
        gpx_changed();
        return true;
    };
    /** @returns {bool} true if a point is dragged */
    const gpx_pointer_move = (page_x, page_y) => {
        if (gpx_measure.down)
            gpx_measure.down.moved = Math.max(gpx_measure.down.moved, Math.hypot(page_x - gpx_measure.down.x, page_y - gpx_measure.down.y));
        if (gpx_measure.drag !== null)
            return measure_pointer_move(page_x, page_y);
        if (!gpx_drag)
            return false;
        // the depth readback only contains the terrain, so this is the terrain position below the cursor
        const w = get_map_drag_start(page_x, page_y);
        if (w && !isNaN(w.x()) && gpx_selected) {
            if (!gpx_drag.undo_pushed) {
                gpx_doc.push_undo();
                gpx_drag.undo_pushed = true;
            }
            const point = gpx_doc.segments[gpx_selected.seg].points[gpx_selected.i];
            gpx_doc.set_point(point, w.x(), w.y(), terrain_height_mean_at(w.x(), w.y()));
            gpx_changed();
        }
        return true;
    };
    // registered in the capture phase to be executed before the camera handlers which are then stopped
    canvas3d.addEventListener("mousedown", (e) => {
        if (e.button == 0 && gpx_pointer_down(false, e.pageX, e.pageY)) {
            e.stopImmediatePropagation();
            e.preventDefault();
        }
    }, {capture: true});
    canvas3d.addEventListener("mousemove", (e) => {
        if (gpx_pointer_move(e.pageX, e.pageY))
            e.stopImmediatePropagation();
    }, {capture: true});
    canvas3d.addEventListener("touchstart", (e) => {
        if (e.touches.length == 1 && gpx_pointer_down(true, e.touches[0].pageX, e.touches[0].pageY)) {
            e.stopImmediatePropagation();
            e.preventDefault();
        }
    }, {capture: true, passive: false});
    canvas3d.addEventListener("touchmove", (e) => {
        if (e.touches.length == 1 && gpx_pointer_move(e.touches[0].pageX, e.touches[0].pageY)) {
            e.stopImmediatePropagation();
            e.preventDefault();
        }
    }, {capture: true, passive: false});
    for (const type of ["mouseup", "touchend", "touchcancel"])
        window.addEventListener(type, (e) => {
            gpx_drag = null;
            measure_pointer_up(type != "touchcancel");
        });
    window.addEventListener("keydown", (e) => {
        if (gpx_mode != "edit" || !is_editor || ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName))
            return;
        if (e.key == "Delete" || e.key == "Backspace") {
            gpx_delete_selected();
            e.preventDefault();
        }
        if (e.key == "z" && (e.ctrlKey || e.metaKey)) {
            gpx_undo();
            e.preventDefault();
        }
    });

    // recording ------------------------------------------------------------------------------
    gpx_recorder.on_point = (p) => {
        const seg = gpx_record_segment();
        if (!seg)
            return;
        gpx_doc.insert_point(seg, seg.points.length, {...p, ele: terrain_height_mean_at(p.x, p.y)});
        gpx_changed();
    };
    gpx_recorder.on_update = () => gpx_changed();
    const gpx_toggle_recording = () => {
        if (gpx_recorder.recording) {
            gpx_recorder.stop();
            const seg = gpx_record_segment();
            if (seg && !seg.points.length)
                gpx_doc.remove_segment(seg);
            gpx_record_track_name = null;
            save();
            return;
        }
        gpx_recorder.max_accuracy_m = +document.getElementById("gpx_max_accuracy").value;
        gpx_recorder.min_distance_m = +document.getElementById("gpx_min_distance").value;
        if (!gpx_recorder.start())
            return;
        gpx_doc.push_undo();
        gpx_record_track_name = "Aufnahme " + new Date().toLocaleString("de-DE");
        gpx_doc.create_track(gpx_record_track_name);
        // keeps the map around the current position loaded
        document.getElementById("enable_cam_follow").checked = true;
    };

    // follow animation -----------------------------------------------------------------------
    /** @brief places the camera behind the current track position looking along the (smoothed) track direction */
    const update_follow_camera = () => {
        gpx_follow.update_requested = false;
        if (!gpx_follower.length_m) {
            gpx_follow.playing = false;
            return;
        }
        const now = performance.now();
        const dt = gpx_follow.last_t ? Math.min((now - gpx_follow.last_t) / 1000, .2) : 0;
        gpx_follow.last_t = now;
        if (gpx_follow.playing) {
            gpx_follow.s += gpx_follow.speed_mps * dt;
            if (gpx_follow.s >= gpx_follower.length_m) {
                gpx_follow.s = gpx_follower.length_m;
                gpx_follow.playing = false;
            }
        }
        const s = gpx_follow.s;
        const p = gpx_follower.position_at(s);
        // the direction is taken over the next part of the track to smooth out small zig zags
        const look_ahead_m = Math.max(40, gpx_follow.speed_mps * 4);
        const ahead = gpx_follower.position_at(s + look_ahead_m), behind = gpx_follower.position_at(s - 5);
        let dx = ahead.x - behind.x, dy = ahead.y - behind.y;
        let len = Math.hypot(dx, dy);
        if (len < 1e-14)
            [dx, dy, len] = gpx_follow.dir ? [...gpx_follow.dir, 1] : [0, -1, 1];
        dx /= len;
        dy /= len;
        if (gpx_follow.dir && dt > 0) {
            const a = 1 - Math.exp(-dt / .8);
            dx = gpx_follow.dir[0] + a * (dx - gpx_follow.dir[0]);
            dy = gpx_follow.dir[1] + a * (dy - gpx_follow.dir[1]);
            len = Math.hypot(dx, dy) || 1;
            dx /= len;
            dy /= len;
        }
        gpx_follow.dir = [dx, dy];

        const uv_per_m = 1 / GpxUtil.meters_per_uv(p.y);
        const back_m = 70 * gpx_follow.zoom, height_m = 35 * gpx_follow.zoom, target_ahead_m = 15;
        const ground = (x, y) => terrain_height_mean_at(x, y) ?? 0;
        const eye = {x: p.x - dx * back_m * uv_per_m, y: p.y - dy * back_m * uv_per_m};
        const target = {x: p.x + dx * target_ahead_m * uv_per_m, y: p.y + dy * target_ahead_m * uv_per_m};
        camera_center.entries[0] = eye.x;
        camera_center.entries[1] = eye.y;
        camera_center.entries[2] = Util.m_to_wgs_84_uv(Math.max(ground(eye.x, eye.y), ground(p.x, p.y)) + height_m) * 1.4;
        // the camera looks along -get_forward_dir(camera_dir, camera_pitch)
        const vx = target.x - eye.x, vy = target.y - eye.y, vz = Util.m_to_wgs_84_uv(ground(target.x, target.y)) * 1.4 - camera_center.z();
        camera_dir = Math.atan2(-vx, -vy);
        if (camera_dir < 0)
            camera_dir += 2 * Math.PI;
        camera_pitch = Math.asin(-vz / Math.hypot(vx, vy, vz));
        draw_requested = true;
        update_gpx_ui();
    };
    /** @param {float} zoom factor for the camera distance, 1 is the default distance */
    const gpx_set_follow_zoom = (zoom) => {
        gpx_follow.zoom = Math.min(Math.max(zoom, .25), 8);
        document.getElementById("gpx_follow_zoom").value = Math.round(Math.log2(gpx_follow.zoom) * 50);
        gpx_follow.update_requested = true;
    };
    // in the follow mode the wheel and pinch change the camera distance instead of moving the camera
    let gpx_pinch = null;
    canvas3d.addEventListener("wheel", (e) => {
        if (gpx_mode != "follow")
            return;
        gpx_set_follow_zoom(gpx_follow.zoom * Math.exp(e.deltaY * .002));
        e.stopImmediatePropagation();
        e.preventDefault();
    }, {capture: true, passive: false});
    canvas3d.addEventListener("touchstart", (e) => {
        if (gpx_mode == "follow" && e.touches.length == 2) {
            gpx_pinch = {dist: Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY), zoom: gpx_follow.zoom};
            e.stopImmediatePropagation();
        }
    }, {capture: true});
    canvas3d.addEventListener("touchmove", (e) => {
        if (!gpx_pinch || e.touches.length != 2)
            return;
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        gpx_set_follow_zoom(gpx_pinch.zoom * gpx_pinch.dist / Math.max(dist, 1));
        e.stopImmediatePropagation();
        e.preventDefault();
    }, {capture: true, passive: false});
    for (const type of ["touchend", "touchcancel"])
        canvas3d.addEventListener(type, (e) => { if (e.touches.length < 2) gpx_pinch = null; });
    const gpx_toggle_follow = () => {
        if (!gpx_follow.playing && gpx_follow.s >= gpx_follower.length_m)
            gpx_follow.s = 0;
        gpx_follow.playing = !gpx_follow.playing;
        gpx_follow.last_t = 0;
        gpx_follow.update_requested = true;
        update_gpx_ui();
    };

    // saving ---------------------------------------------------------------------------------
    async function save() {
        if (!is_editor || gpx_doc.parse_error || gpx_saving || gpx_doc.version == gpx_saved_version)
            return;
        gpx_saving = true;
        const version = gpx_doc.version;
        const text = gpx_doc.serialize();
        try {
            const res = await (await fetch(location.origin + "/update_file", {
                headers: { path: file_path, revision: file_revision },
                method: "POST",
                body: text,
            })).json();
            if (res.error)
                throw new Error(res.error);
            if (res.revision)
                file_revision = res.revision;
            gpx_saved_version = version;
            // changes from others were merged in, only taken if there were no further local changes in the meantime
            if (res.merged_content && res.merged_content != text && gpx_doc.version == version && !gpx_drag)
                gpx_reload(res.merged_content);
            try { localStorage.removeItem(gpx_backup_key); } catch (e) {}
            gpx_save_state = "gespeichert";
        } catch (e) {
            // e.g. no connection while recording, the data is kept locally and saved with the next try
            try { localStorage.setItem(gpx_backup_key, text); } catch (e) {}
            gpx_save_state = "nicht gespeichert, lokal gesichert";
        }
        gpx_saving = false;
        update_gpx_ui();
    }
    /** @brief takes over changes of the file from other devices (e.g. a recording phone) */
    async function check_remote_changes() {
        if (gpx_saving || gpx_drag)
            return;
        try {
            const res = await (await fetch(location.origin + "/check_file_revision", {
                headers: { path: file_path, revision: file_revision },
            })).json();
            if (!res.file_revision)
                return;
            if (gpx_doc.version != gpx_saved_version) {
                await save();   // the server merges both versions
                return;
            }
            file_revision = res.file_revision;
            gpx_reload(res.file_data);
        } catch (e) {}
    }

    // measuring ------------------------------------------------------------------------------
    /** @type {TrackRenderer} */
    let measure_renderer = null;
    // down: position of a pointer down which adds a point on release if it did not move (dragging still moves the camera)
    const gpx_measure = {type: "distance", points: [], version: 0, drag: null, down: null};
    let gpx_track_profile = {version: -1, time: 0, html: ""};
    const measure_changed = () => {
        gpx_measure.version++;
        gpx_changed();
    };
    /** @returns {Object} document like object with the measure points for the TrackRenderer */
    const measure_render_doc = () => {
        const pts = gpx_measure.points;
        const closed = gpx_measure.type == "area" && pts.length >= 3;
        return {version: gpx_measure.version, segments: [{kind: gpx_measure.type == "point" ? "wpt" : "trk", points: closed ? [...pts, pts[0]] : pts}]};
    };
    const measure_pointer_down = (touch, page_x, page_y) => {
        const r = canvas3d.getBoundingClientRect();
        const [view_projection, , , grid_offset_pos] = get_projection_mat(camera_center, canvas3d);
        const radius = touch ? 28 : 14;
        let best = -1, best_d = radius;
        gpx_measure.points.forEach((p, i) => {
            const s = project_to_screen(view_projection, grid_offset_pos, p.x, p.y);
            const d = s ? Math.hypot(s.x - (page_x - r.left), s.y - (page_y - r.top)) : Infinity;
            if (d < best_d) {
                best_d = d;
                best = i;
            }
        });
        if (best >= 0) {
            gpx_measure.drag = best;
            return true;
        }
        gpx_measure.down = {x: page_x, y: page_y, moved: 0};
        return false;
    };
    const measure_pointer_move = (page_x, page_y) => {
        const w = get_map_drag_start(page_x, page_y);
        if (w && !isNaN(w.x())) {
            gpx_measure.points[gpx_measure.drag] = {x: w.x(), y: w.y()};
            measure_changed();
        }
        return true;
    };
    /** @param {bool} completed false if the pointer action was cancelled */
    const measure_pointer_up = (completed) => {
        const down = gpx_measure.down;
        gpx_measure.down = null;
        gpx_measure.drag = null;
        if (!completed || !down || down.moved > 6 || gpx_mode != "measure")
            return;
        const w = get_map_drag_start(down.x, down.y);
        if (!w || isNaN(w.x()))
            return;
        if (gpx_measure.type == "point")
            gpx_measure.points = [];
        gpx_measure.points.push({x: w.x(), y: w.y()});
        measure_changed();
    };
    /**
     * @brief samples the terrain every 5 m along the polyline
     * @returns {Object} length_m (horizontal), length_3d_m (along the terrain), ascent_m, descent_m, missing (true if heights were not loaded)
     */
    const terrain_profile = (points) => {
        let res = {length_m: 0, length_3d_m: 0, ascent_m: 0, descent_m: 0, missing: false};
        let prev = null;
        const add_sample = (x, y) => {
            const h = terrain_height_mean_at(x, y);
            res.missing |= h === null;
            if (prev) {
                const d = GpxUtil.distance_m(prev, {x: x, y: y});
                const dh = h !== null && prev.h !== null ? h - prev.h : 0;
                res.length_3d_m += Math.hypot(d, dh);
                res.ascent_m += Math.max(dh, 0);
                res.descent_m += Math.max(-dh, 0);
            }
            prev = {x: x, y: y, h: h};
        };
        for (let i = 0; i < points.length; ++i) {
            if (i == 0) {
                add_sample(points[0].x, points[0].y);
                continue;
            }
            const a = points[i - 1], b = points[i];
            const d = GpxUtil.distance_m(a, b);
            res.length_m += d;
            const steps = Math.min(Math.max(Math.ceil(d / 5), 1), 2000);
            for (let k = 1; k <= steps; ++k)
                add_sample(a.x + (b.x - a.x) * k / steps, a.y + (b.y - a.y) * k / steps);
        }
        return res;
    };
    /** @returns {float} area of the polygon in m^2 (shoelace in the local mercator scale) */
    const polygon_area_m2 = (points) => {
        const m_per_uv = GpxUtil.meters_per_uv(points.reduce((s, p) => s + p.y, 0) / points.length);
        let a = 0;
        for (let i = 0; i < points.length; ++i) {
            const p = points[i], q = points[(i + 1) % points.length];
            a += p.x * q.y - q.x * p.y;
        }
        return Math.abs(a) / 2 * m_per_uv * m_per_uv;
    };
    const format_length = (m) => m < 1000 ? `${m.toFixed(1)} m` : `${(m / 1000).toFixed(3)} km`;
    const format_area = (m2) => m2 < 1e4 ? `${m2.toFixed(1)} m²` : m2 < 1e6 ? `${(m2 / 1e4).toFixed(3)} ha (${m2.toFixed(0)} m²)` : `${(m2 / 1e6).toFixed(3)} km²`;
    const format_height = (h) => h === null ? "nicht geladen" : `${h.toFixed(1)} m`;
    const profile_html = (p) => `${format_length(p.length_m)}, über Gelände ${format_length(p.length_3d_m)}, ` +
                                `&#8599; ${p.ascent_m.toFixed(0)} m &#8600; ${p.descent_m.toFixed(0)} m${p.missing ? " (Höhen teilweise nicht geladen)" : ""}`;
    const measure_results_html = () => {
        const pts = gpx_measure.points;
        let lines = [];
        if (!pts.length)
            lines.push(is_touch ? "Auf die Karte tippen um Punkte zu setzen" : "Auf die Karte klicken um Punkte zu setzen, Punkte können verschoben werden");
        else if (gpx_measure.type == "point") {
            const [lat, lon] = GpxUtil.uv_to_wgs_84(pts[0].x, pts[0].y);
            lines.push(`${lat.toFixed(6)}, ${lon.toFixed(6)}, Höhe ${format_height(terrain_height_mean_at(pts[0].x, pts[0].y))}`);
        } else if (gpx_measure.type == "distance") {
            lines.push(`Strecke: ${profile_html(terrain_profile(pts))}`);
            lines.push(`Höhe Start ${format_height(terrain_height_mean_at(pts[0].x, pts[0].y))}, Ende ${format_height(terrain_height_mean_at(pts.at(-1).x, pts.at(-1).y))}`);
        } else if (pts.length < 3) {
            lines.push("Mindestens 3 Punkte für eine Fläche setzen");
        } else {
            lines.push(`Fläche: ${format_area(polygon_area_m2(pts))}, Umfang ${format_length(terrain_profile([...pts, pts[0]]).length_m)}`);
        }
        // the track profile is cached as the terrain sampling is expensive for long tracks, refreshed for newly loaded heights
        if (gpx_track_profile.version != gpx_doc.version || performance.now() - gpx_track_profile.time > 2000) {
            const tracks = gpx_doc.segments.filter(s => s.kind != "wpt" && s.points.length > 1).map(s => terrain_profile(s.points));
            gpx_track_profile = {version: gpx_doc.version, time: performance.now(),
                                 html: tracks.length ? "Track: " + profile_html(tracks.reduce((a, p) => ({length_m: a.length_m + p.length_m, length_3d_m: a.length_3d_m + p.length_3d_m,
                                       ascent_m: a.ascent_m + p.ascent_m, descent_m: a.descent_m + p.descent_m, missing: a.missing || p.missing}))) : ""};
        }
        if (gpx_track_profile.html)
            lines.push(gpx_track_profile.html);
        return lines.join("<br>");
    };

    // ui -------------------------------------------------------------------------------------
    const gpx_set_mode = (mode) => {
        if (mode == "follow" && gpx_mode != "follow") {
            gpx_follower.init(gpx_doc);
            gpx_follow.s = Math.min(gpx_follow.s, gpx_follower.length_m);
            gpx_follow.dir = null;
            gpx_follow.update_requested = true;
        }
        if (mode != "follow")
            gpx_follow.playing = false;
        if (mode != "edit")
            gpx_drag = null;
        gpx_mode = mode;
        gpx_changed();
    };
    function update_gpx_ui() {
        const set_hidden = (id, hidden) => document.getElementById(id).classList.toggle("gpx_hidden", hidden);
        for (const b of document.querySelectorAll(".gpx_mode"))
            b.classList.toggle("active", b.dataset.mode == gpx_mode);
        set_hidden("gpx_edit_controls", gpx_mode != "edit");
        set_hidden("gpx_record_controls", gpx_mode != "record");
        set_hidden("gpx_follow_controls", gpx_mode != "follow");
        set_hidden("gpx_measure_controls", gpx_mode != "measure");
        set_hidden("gpx_measure_result", gpx_mode != "measure");
        if (gpx_mode == "measure")
            document.getElementById("gpx_measure_result").innerHTML = measure_results_html();
        document.getElementById("gpx_measure_undo").disabled = !gpx_measure.points.length;
        document.getElementById("gpx_delete").disabled = !gpx_selected;
        document.getElementById("gpx_undo").disabled = !gpx_doc.undo_stack.length || gpx_recorder.recording;

        const rec = gpx_recorder;
        document.getElementById("gpx_record_toggle").textContent = rec.recording ? "Aufnahme beenden" : "Aufnahme starten";
        document.getElementById("gpx_record_toggle").classList.toggle("active", rec.recording);
        set_hidden("gpx_average_start", !rec.recording || !!rec.averaging);
        set_hidden("gpx_average_accept", !rec.averaging);
        set_hidden("gpx_average_cancel", !rec.averaging);

        document.getElementById("gpx_follow_play").innerHTML = gpx_follow.playing ? "&#10074;&#10074;" : "&#9654;";
        if (gpx_follower.length_m && document.activeElement?.id != "gpx_follow_progress")
            document.getElementById("gpx_follow_progress").value = Math.round(gpx_follow.s / gpx_follower.length_m * 1000);

        let status = [];
        if (gpx_doc.parse_error)
            status.push("Die Datei ist kein gültiges GPX, Bearbeiten ist deaktiviert");
        status.push(`${gpx_doc.point_count()} Punkte, ${(gpx_doc.length_m() / 1000).toFixed(2)} km`);
        if (gpx_save_state)
            status.push(gpx_save_state);
        if (gpx_mode == "follow")
            status.push(`${(gpx_follow.s / 1000).toFixed(2)} / ${(gpx_follower.length_m / 1000).toFixed(2)} km`);
        if (rec.recording) {
            const fix = rec.last_fix;
            status.push(fix ? `GPS ±${fix.coords.accuracy.toFixed(1)} m, gefiltert ±${rec.filter_accuracy_m().toFixed(1)} m` : "Warte auf GPS");
            status.push(`${rec.fix_count} Messungen (${rec.rejected_count} verworfen)`);
            if (!rec.wake_lock)
                status.push("Bildschirm anlassen, sonst stoppt die Aufnahme");
            const avg = rec.averaging_result();
            if (rec.averaging)
                status.push(avg ? `Mittelung: ${avg.n} Messungen, ${avg.duration_s.toFixed(0)} s, ±${avg.precision_m.toFixed(2)} m, Streuung ${avg.scatter_m.toFixed(1)} m`
                                : "Mittelung: warte auf Messungen");
        }
        if (rec.error)
            status.push(rec.error);
        document.getElementById("gpx_status").textContent = status.join(" · ");
    }

    /** @brief places the camera such that the whole track is visible, false if there are no points */
    const view_whole_track = () => {
        const points = gpx_doc.segments.flatMap(s => s.points);
        if (!points.length)
            return false;
        const min_x = Math.min(...points.map(p => p.x)), max_x = Math.max(...points.map(p => p.x));
        const min_y = Math.min(...points.map(p => p.y)), max_y = Math.max(...points.map(p => p.y));
        const center = {x: .5 * (min_x + max_x), y: .5 * (min_y + max_y)};
        const m_per_uv = GpxUtil.meters_per_uv(center.y);
        const dist_m = Math.max(800, 1.3 * Math.max(max_x - min_x, max_y - min_y) * m_per_uv);
        // looking north and down, the camera clamp lifts the camera if the terrain is higher than assumed
        camera_dir = 0;
        camera_pitch = .9;
        camera_center = Vec4(center.x, center.y + dist_m * Math.cos(camera_pitch) / m_per_uv, Util.m_to_wgs_84_uv(800 + dist_m * Math.sin(camera_pitch)) * 1.4);
        return true;
    };
    const draw_track = (view_projection, grid_offset_pos, eye) => {
        if (!track_renderer)
            return;
        track_renderer.update(gpx_doc);
        // own position (filtered while recording) and the current position of the follow animation
        let markers = [];
        const own_pos = gpx_recorder.recording && gpx_recorder.filter ? gpx_recorder.filter : cur_gps_pos ? {x: cur_gps_pos.lat, y: cur_gps_pos.lon} : null;
        if (own_pos)
            markers.push({...own_pos, color: [.1, .45, 1, 1]});
        if (gpx_mode == "follow" && gpx_follower.length_m)
            markers.push({...gpx_follower.position_at(gpx_follow.s), color: [1, .55, 0, 1]});
        const draw_params = {
            view_proj: view_projection.entries,
            grid_offset_pos: {x: grid_offset_pos.lat, y: grid_offset_pos.lon},
            cam_pos: [eye.x - grid_offset_pos.lat, eye.y - grid_offset_pos.lon, eye.z],
            eye_offset: eye.offset,
            viewport: [canvas3d.width, canvas3d.height],
            pixel_angle: 2 * Math.tan(eye.fov_deg / 2 * Math.PI / 180) / canvas3d.height,
            lod_factor: mesh_lod_factor(+document.getElementById("triangle_resolution").value, eye.fov_deg),
            max_mesh_level: virtual_height_map.max_level + heightmap_tile_res_log2 - mesh_res_log2,
            virtual_height_map: virtual_height_map,
            show_handles: gpx_mode == "edit",
            selected_index: gpx_selected ? track_renderer.global_index(gpx_selected.seg, gpx_selected.i) : -1,
            handle_size: is_touch ? 22 : 14,
            markers: markers,
        };
        track_renderer.draw(draw_params);
        if (gpx_mode == "measure" && gpx_measure.points.length) {
            measure_renderer.update(measure_render_doc());
            measure_renderer.draw({...draw_params, show_handles: true, selected_index: -1, markers: []});
        }
    };

    async function init() {

        gl_context.bindBuffer(gl_context.UNIFORM_BUFFER, null);

        let c = Util.wgs_84_to_uv(47.80177, 12.89798);
        camera_center = Vec4(c[0], c[1], Util.m_to_wgs_84_uv(700 * 1.4));

            let grid = new Float32Array(height_grid_res * height_grid_res).fill(-Infinity);
            let grid_mean = new Float32Array(height_grid_res * height_grid_res);
            for (let i = 0; i < data.length; i += 4) {
                // same decoding as decode_height() in the shader, empty pixels are decoded to 0
                const h = data[i] | data[i + 1] | data[i + 2] | data[i + 3] ? data[i] * 256 + data[i + 1] + data[i + 2] / 256 - 32768 : 0;
                min = Math.min(min, h);
                max = Math.max(max, h);
                const p = i >> 2;
                const g = ((p >> 8) >> height_grid_shift) * height_grid_res + ((p & 255) >> height_grid_shift);
                grid[g] = Math.max(grid[g], h);
                grid_mean[g] += h / (1 << (2 * height_grid_shift));
            }
            tile.height_range = [min, max];
            tile.height_grid = grid;
            tile.height_grid_mean = grid_mean;
